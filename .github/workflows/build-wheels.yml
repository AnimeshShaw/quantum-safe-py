name: Build vendored wheels

# Runs on version tags (e.g. v0.1.0) — cut a release by tagging master — plus
# manual dispatch for ad-hoc testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels with vendored liboqs
        uses: pypa/cibuildwheel@v2.21

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  smoke-test:
    name: Smoke test vendored wheel (${{ matrix.os }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the built wheel only (no editable install, no sdist)
        shell: bash
        run: |
          WHEEL=$(ls dist/*cp311*.whl | head -n1)
          echo "Installing $WHEEL[liboqs]"
          python -m pip install "$WHEEL[liboqs]"

      - name: Verify liboqs works from the vendored binary, not a source build
        shell: bash
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path

          from quantum_safe.backends import list_available_backends

          backends = list_available_backends()
          assert backends["liboqs"] is True, f"liboqs backend not available: {backends}"

          import oqs

          assert "ML-KEM-768" in oqs.get_enabled_kem_mechanisms()
          assert "ML-DSA-65" in oqs.get_enabled_sig_mechanisms()

          # liboqs-python's own auto-build writes to ~/_oqs by default. If our
          # vendored binary was found and used, that directory must never be
          # touched — its absence is the proof no source build happened.
          default_auto_build_dir = Path.home() / "_oqs"
          assert not default_auto_build_dir.exists(), (
              "liboqs-python fell back to its own auto-build; vendoring didn't take effect"
          )

          # The vendored liboqs and the liboqs-python that loads it must be the pair this
          # release is built for (src/quantum_safe/_liboqs_version.py), with no import warning.
          from quantum_safe.backends.liboqs import liboqs_versions

          v = liboqs_versions()
          assert v["paired"], f"liboqs / liboqs-python mismatch: {v}"
          assert v["liboqs"].split(".")[:2] == v["expected"].split(".")[:2], f"unexpected liboqs: {v}"

          print("OQS_INSTALL_PATH used:", os.environ.get("OQS_INSTALL_PATH"))
          print("liboqs OK —", oqs.oqs_version(), "| pair:", v)
          EOF

      - name: Importing the backend must not warn (fresh interpreter, warnings are errors)
        shell: bash
        run: |
          python -W error -c "from quantum_safe.backends.liboqs import LiboqsKEMBackend; LiboqsKEMBackend().supported_algorithms(); print('no warning')"

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        # Source distribution for platforms our wheel matrix doesn't cover
        # (ARM Linux, Intel Mac, macOS <14, 32-bit) — pip falls back to
        # liboqs-python's normal build-from-source path there.
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [smoke-test, build-sdist]
    runs-on: ubuntu-latest
    # Requires a PYPI_API_TOKEN repository secret (Settings > Secrets and
    # variables > Actions), scoped on pypi.org to just this project, not your
    # whole account. Using this instead of trusted publishing (OIDC) for now —
    # switch back by removing `with.password` here and adding
    # `permissions: id-token: write` once trusted publishing is set up.
    environment: pypi

    steps:
      - name: Download all wheels + sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
